name: CI

on:
  push:
  pull_request:

# Every kind of test is its own job, so they run in parallel and a red one is visible at a glance.
# Jobs that need a browser run in Playwright's image (Chromium and its system libraries included);
# keep its tag on the version in frontend/ and e2e/package.json.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: node scripts/lint.mjs

  backend:
    name: backend (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: node scripts/test-backend.mjs ${{ matrix.suite }}

  frontend-unit:
    name: frontend (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node scripts/test-frontend.mjs unit

  frontend-component:
    name: frontend (component)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node scripts/test-frontend.mjs component

  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: node scripts/test-e2e.mjs
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # Only what passed everything on main becomes the image the server pulls.
  image:
    needs: [lint, backend, frontend-unit, frontend-component, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The exact image of this commit, so the deploy runs what was tested.
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # Every green push to main goes live. The configuration comes from the "production"
  # environment's secrets and variables and reaches the server as environment variables;
  # setup in deploy/README.md.
  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Secrets via env, never spliced into the script itself.
      - name: SSH access to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - run: node scripts/deploy.mjs "$DEPLOY_HOST"
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          OVERWORKED_IMAGE: ${{ needs.image.outputs.image }}
          OVERWORKED_DOMAIN: ${{ vars.OVERWORKED_DOMAIN }}
          OVERWORKED_PASSWORD: ${{ secrets.OVERWORKED_PASSWORD }}
          OVERWORKED_SECRET_KEY: ${{ secrets.OVERWORKED_SECRET_KEY }}
          OVERWORKED_NTFY_TOPIC: ${{ secrets.OVERWORKED_NTFY_TOPIC }}
          OVERWORKED_VAPID_PUBLIC_KEY: ${{ vars.OVERWORKED_VAPID_PUBLIC_KEY }}
          OVERWORKED_VAPID_PRIVATE_KEY: ${{ secrets.OVERWORKED_VAPID_PRIVATE_KEY }}
