# Only used for the alembic CLI (creating new migrations). The app applies
# migrations itself on startup via overworked.migrations.upgrade_to_head().
# The database URL comes from OVERWORKED_DATABASE_URL (see overworked.config).
[alembic]
script_location = %(here)s/src/overworked/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
