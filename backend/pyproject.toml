[project]
name = "overworked"
version = "0.1.0"
description = "Feierabend-Wecker: Backend"
authors = [
    { name = "mzietlow", email = "zietlow.m@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "pywebpush>=2.5.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
