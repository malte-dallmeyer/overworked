# Production: Caddy terminates HTTPS (Let's Encrypt) and forwards to the app.
# `node scripts/deploy.mjs` copies this file and the Caddyfile to the server and runs
# `docker compose` there with the configuration as environment variables (no file).
services:
  app:
    image: ${OVERWORKED_IMAGE:?OVERWORKED_IMAGE is not set}
    restart: unless-stopped
    environment:
      # Without a value: taken from the environment `docker compose` runs in, if set.
      OVERWORKED_PASSWORD:
      OVERWORKED_SECRET_KEY:
      OVERWORKED_NTFY_URL:
      OVERWORKED_NTFY_TOPIC:
      OVERWORKED_NTFY_TOKEN:
      OVERWORKED_VAPID_PUBLIC_KEY:
      OVERWORKED_VAPID_PRIVATE_KEY:
      OVERWORKED_VAPID_SUBJECT:
      OVERWORKED_ALARM_CHECK_INTERVAL_SECONDS:
      # For the buttons in the notification and opening the app from it.
      OVERWORKED_PUBLIC_URL: https://${OVERWORKED_DOMAIN:?OVERWORKED_DOMAIN is not set}
    volumes:
      - data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      OVERWORKED_DOMAIN: ${OVERWORKED_DOMAIN:?OVERWORKED_DOMAIN is not set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config:
